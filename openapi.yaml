openapi: 3.0.3
info: {title: whats360.live Email Send API (draft from dashboard docs), version: 0.1.0, description: Draft. Not verified against the live service.}
servers: [{url: https://whats360.live}]
paths:
  /api/auth/login:
    post:
      summary: Get a token
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [username, password], properties: {username: {type: string}, password: {type: string}}}
      responses:
        '200': {description: "JSON with token"}
  /api/v1/email/send:
    post:
      summary: Send an email
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [from, to, subject], properties: {from: {type: string}, to: {type: string}, subject: {type: string}, body: {type: string}}}
      responses:
        '200': {description: '{"ok": true, "data": {"message": "Email sent successfully"}}'}
        '4XX': {description: '{"ok": false, "error": "..."}'}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
